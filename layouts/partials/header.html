<script>
    document.addEventListener("DOMContentLoaded", function () {
        const darkModeToggle = document.getElementById("darkModeToggle");
        const darkModeToggleMobile = document.getElementById("darkModeToggleMobile");
        const mobileMenuToggle = document.getElementById("mobileMenuToggle");
        const mobileNav = document.getElementById("mobileNav");
        const menuIcon = document.getElementById("menuIcon");

        // Initial theme is applied before first paint in head.html
        const handleDarkModeToggle = () => {
            const isDarkMode = document.documentElement.classList.toggle('dark');
            localStorage.setItem('dark-mode', isDarkMode ? 'enabled' : 'disabled');
        };

        if (darkModeToggle) darkModeToggle.addEventListener("click", handleDarkModeToggle);
        if (darkModeToggleMobile) darkModeToggleMobile.addEventListener("click", handleDarkModeToggle);

        // Mobile menu toggle
        if (mobileMenuToggle && mobileNav) {
            mobileMenuToggle.addEventListener("click", function () {
                const isOpen = !mobileNav.classList.contains('hidden');
                mobileNav.classList.toggle('hidden');
                // Update icon to X when open
                if (isOpen) {
                    menuIcon.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
                } else {
                    menuIcon.setAttribute('d', 'M6 18L18 6M6 6l12 12');
                }
            });
        }
    });
</script>

<header class="w-full sticky sm:relative top-0 z-50 bg-gray-50/95 dark:bg-gray-900/95 sm:!bg-transparent sm:dark:!bg-transparent backdrop-blur-sm sm:backdrop-blur-none py-2 px-4 sm:p-4 text-base sm:text-xl md:text-2xl flex flex-col text-gray-900 dark:text-slate-50">
            <!-- Mobile header row -->
            <div class="flex sm:hidden items-center justify-between w-full">
                <a href="/">{{ partial "fermata.html" . }}</a>
                <button id="mobileMenuToggle" class="p-2 w-11 h-11 flex items-center justify-center" aria-label="Toggle menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path id="menuIcon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>

            <!-- Desktop nav -->
            <nav class="hidden sm:flex items-center justify-center">
                <a href="/">{{ partial "fermata.html" . }}</a>
                {{ $currentPage := . }}
                <div id="desktopNav" class="flex items-center">
                {{ range .Site.Menus.main }}
                <a class="mx-2 md:mx-4 whitespace-nowrap min-h-[44px] flex items-center {{ if $currentPage.IsMenuCurrent "main" . }}is-active{{ end }}"
                    href="{{ .URL }}">
                    {{ .Name }}
                </a>
                {{ end }}
                </div>
                <button id="darkModeToggle" class="p-2 w-11 h-11" aria-label="Toggle dark mode">
                    {{ partial "toggle-icon.html" . }}
                </button>
            </nav>

            <!-- Mobile nav dropdown -->
            <div id="mobileNav" class="hidden sm:hidden w-full mt-4 flex flex-col items-center space-y-2 pb-4 border-b border-gray-200 dark:border-gray-700">
                {{ range .Site.Menus.main }}
                <a class="py-2 px-4 min-h-[44px] flex items-center justify-center {{ if $currentPage.IsMenuCurrent "main" . }}is-active{{ end }}"
                    href="{{ .URL }}">
                    {{ .Name }}
                </a>
                {{ end }}
                <button id="darkModeToggleMobile" class="p-2 w-11 h-11" aria-label="Toggle dark mode">
                    {{ partial "toggle-icon.html" . }}
                </button>
            </div>
</header>

<style>
            .is-active {
                text-decoration: underline;
            }
</style>

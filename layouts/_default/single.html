{{ define "main" }}

<main class="flex flex-col items-center min-h-screen bg-gray-50 px-4 py-8 dark:bg-gray-900 dark:text-slate-50">
    <div class="bg-white rounded-xl p-8 w-full max-w-3xl shadow-lg dark:bg-gray-700 dark:text-slate-50">
        {{ if .Date }}
            <p class="text-sm text-gray-500 mb-2">{{ .Date | time.Format ":date_long" }}</p>
        {{ end }}
        {{ if .Title}}
        <h2 class="text-2xl font-semibold mb-4">{{ .Title }}</h1>
        {{ end }}
        {{ if .Params.tags }}
        <div class="tags mb-4">
            {{ range .Params.tags }}
            <a href="{{ with $.Site.GetPage (print "tags/" .) }}{{ .Permalink }}{{ end }}" class="tag">{{ . | lower }}</a>
            {{ end }}
        </div>
        {{ end }}
        <div class="markdown-content">
            {{ .Content }}
        </div>
    </div>
</main>

{{ partial "footer.html" . }}

<style>
    .markdown-content p {
        margin-top: 1rem;
        margin-bottom: 1rem;
    }

    .markdown-content a {
        text-decoration: underline;
        transition: color 200ms;
    }

    .markdown-content a:hover {
        color: #3B82F6;
    }

    .markdown-content ul {
        list-style-type: disc;
        margin-top: 1rem;
        margin-bottom: 1rem;
        padding-left: 1.5rem;
    }

    .markdown-content ol {
        list-style-type: number;
        margin-top: 1rem;
        margin-bottom: 1rem;
        padding-left: 1.5rem;
    }

    .markdown-content li {
        margin-bottom: 0.5rem;
    }

    .markdown-content img {
        max-width: 100%;
        height: auto;
        padding: 1rem 0rem;
        display: block;
        margin: 0 auto;
    }

    .markdown-content .alert-banner {
        background-color: #ffcccc;
        color: #333;
        padding: 1rem;
        margin-bottom: 2rem;
        border-left: 4px solid #cc0000;
        font-style: italic;
    }

    .tag {
        display: inline-block;
        background-color: #f0f0f0;
        color: #333;
        border-radius: 16px;
        padding: 4px 8px;
        margin-right: 4px;
        font-size: 0.75rem;
        text-transform: lowercase;
        text-decoration: none;
    }

    .tag:hover {
        background-color: #e2e2e2;
    }

    pre code {
        text-wrap: wrap;
        text-indent: 2em;
    }

</style>

{{ end }}
